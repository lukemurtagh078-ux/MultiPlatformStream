<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Stream</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#streamPage {
  position: fixed;
  inset: 0;
  background: #000;
}

#layout {
  width: 100%;
  height: 100%;
  display: grid;
  gap: 2px;
  background: #000;
}

.stream-panel, .chat-panel {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #000;
}

.stream-frame, .chat-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

.stream-placeholder {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  font-size: clamp(14px, 2vw, 24px);
  font-weight: bold;
  text-align: center;
  padding: 10px;
  pointer-events: none;
  background: #000;
}

.stream-settings {
  position: absolute;
  top: 8px;
  left: 8px;
  right: auto;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  align-items: center;
  padding: 6px;
  border-radius: 7px;
  background: rgba(15,15,15,.94);
  border: 1px solid #444;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
  max-width: calc(100% - 16px);
}

.stream-panel:hover .stream-settings,
.stream-panel:focus-within .stream-settings {
  opacity: 1;
  pointer-events: auto;
}

.stream-settings select,
.stream-settings input,
.stream-settings button {
  height: 32px;
  min-width: 0;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: #fff;
  outline: none;
}

.stream-settings select {
  width: 95px;
  padding: 0 5px;
}

.stream-settings input {
  width: clamp(100px, 15vw, 190px);
  padding: 0 9px;
}

.stream-settings button {
  padding: 0 12px;
  cursor: pointer;
  font-weight: bold;
}

.stream-settings button:hover,
#settingsToggle:hover,
#topbar button:hover {
  background: #9146ff;
}

.chat-frame { display: block; }

#settingsToggle {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 100000;
  width: 40px;
  height: 40px;
  border: 1px solid #444;
  border-radius: 7px;
  background: rgba(20,20,20,.92);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  cursor: pointer;
}

#topbar {
  position: fixed;
  top: 10px;
  left: 60px;
  z-index: 100001;
  display: none;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  max-width: calc(100vw - 75px);
  padding: 9px;
  background: rgba(15,15,15,.97);
  border: 1px solid #444;
  border-radius: 7px;
}

#topbar label {
  color: #fff;
  font-size: 13px;
  font-weight: bold;
}

#topbar select,
#topbar button {
  height: 34px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: #fff;
}

#topbar select { padding: 0 8px; }

#topbar button {
  padding: 0 13px;
  cursor: pointer;
  font-weight: bold;
}

#chatToggleLabel {
  display: flex;
  align-items: center;

  color: #fff;
  font-size: 13px;

  cursor: pointer;
  white-space: nowrap;
}

#chatEnabled {
  width: 17px;
  height: 17px;
  accent-color: #9146ff;
  cursor: pointer;
}

@media (max-width: 600px) {
  .stream-settings {
    top: 4px;
    left: 4px;
    gap: 3px;
    padding: 4px;
  }

  .stream-settings select { width: 75px; }
  .stream-settings input { width: 100px; }
  .stream-settings button { padding: 0 7px; }
}
</style>
</head>

<body>

<div id="streamPage">
  <div id="layout"></div>
</div>

<button id="settingsToggle" title="Settings">⚙</button>

<div id="topbar">
  <label for="streamCount">STREAMS:</label>

  <select id="streamCount">
    <option value="1">1 Stream</option>
    <option value="2">2 Streams</option>
    <option value="3">3 Streams</option>
    <option value="4">4 Streams</option>
    <option value="5">5 Streams</option>
    <option value="6">6 Streams</option>
    <option value="7">7 Streams</option>
    <option value="8">8 Streams</option>
    <option value="9">9 Streams</option>
    <option value="10">10 Streams</option>
    <option value="11">11 Streams</option>
    <option value="12">12 Streams</option>
  </select>

  <label id="chatToggleLabel" for="chatEnabled">
    <input type="checkbox" id="chatEnabled" checked>
    CHAT ON
  </label>

  <button id="applyBtn">APPLY</button>
</div>

<script>
/* STORAGE
   Only YouTube videos and their playback positions persist.
   Twitch and Kick streams are deliberately never restored.
*/

const YOUTUBE_STORAGE_KEY = "multiStreamYouTubeProgress";
const COUNT_STORAGE_KEY = "multiStreamLayoutCount";
const CHAT_STORAGE_KEY = "multiStreamChatEnabled";

const DEFAULT_STREAM_COUNT = 3;

function readStorage(key, fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch (e) {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function createEmptyStream() {
  return {
    platform: "twitch",
    channel: "",
    muted: true,
    paused: true
  };
}

const savedCount = Number(
  readStorage(COUNT_STORAGE_KEY, DEFAULT_STREAM_COUNT)
);

const DEFAULT_COUNT =
  Number.isInteger(savedCount) && savedCount >= 1 && savedCount <= 12
    ? savedCount
    : DEFAULT_STREAM_COUNT;

let chatEnabled = readStorage(CHAT_STORAGE_KEY, true) !== false;

let streamData = Array.from(
  { length: DEFAULT_COUNT },
  () => createEmptyStream()
);

let youtubeProgress = readStorage(YOUTUBE_STORAGE_KEY, {});

if (
  !youtubeProgress ||
  typeof youtubeProgress !== "object" ||
  Array.isArray(youtubeProgress)
) {
  youtubeProgress = {};
}

/* RESTORE YOUTUBE ONLY */

for (let i = 0; i < streamData.length; i++) {
  const saved = youtubeProgress[i];

  if (saved && saved.platform === "youtube" && saved.channel) {
    streamData[i] = {
      platform: "youtube",
      channel: saved.channel,
      muted: true,
      paused: true
    };
  }
}

/* ELEMENTS */

const layout = document.getElementById("layout");
const settingsToggle = document.getElementById("settingsToggle");
const topbar = document.getElementById("topbar");
const streamCount = document.getElementById("streamCount");
const chatCheckbox = document.getElementById("chatEnabled");
const applyBtn = document.getElementById("applyBtn");

const youtubePlayers = new Map();
let youtubeAPIReady = false;
let youtubeAPILoading = false;

/* YOUTUBE VIDEO ID */

function getYouTubeID(input) {
  input = input.trim();

  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
    return input;
  }

  try {
    const url = new URL(input);
    const host = url.hostname.toLowerCase();
    let id = "";

    if (host === "youtu.be" || host === "www.youtu.be") {
      id = url.pathname.split("/").filter(Boolean)[0] || "";
    } else if (
      host === "youtube.com" ||
      host.endsWith(".youtube.com") ||
      host === "youtube-nocookie.com" ||
      host.endsWith(".youtube-nocookie.com")
    ) {
      if (url.searchParams.has("v")) {
        id = url.searchParams.get("v");
      } else {
        const parts = url.pathname.split("/").filter(Boolean);
        const index = parts.findIndex(part =>
          ["embed", "live", "shorts", "v"].includes(part)
        );

        if (index !== -1) id = parts[index + 1] || "";
      }
    }

    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
  } catch (e) {
    return null;
  }
}

/* SAVE YOUTUBE VIDEO AND POSITION */

function saveYouTubeProgress(index, videoId, seconds) {
  if (!videoId) return;

  youtubeProgress[index] = {
    platform: "youtube",
    channel: videoId,
    position: Math.max(0, Number(seconds) || 0)
  };

  writeStorage(YOUTUBE_STORAGE_KEY, youtubeProgress);
}

function savePlayerPosition(index, player) {
  try {
    if (
      player &&
      typeof player.getCurrentTime === "function" &&
      typeof player.getPlayerState === "function"
    ) {
      const time = player.getCurrentTime();

      if (Number.isFinite(time)) {
        const data = streamData[index];
        if (data && data.platform === "youtube") {
          saveYouTubeProgress(
            index,
            getYouTubeID(data.channel),
            time
          );
        }
      }
    }
  } catch (e) {}
}

/* LOAD YOUTUBE IFRAME API */

function loadYouTubeAPI() {
  if (youtubeAPIReady || youtubeAPILoading) return;

  youtubeAPILoading = true;

  window.onYouTubeIframeAPIReady = function() {
    youtubeAPIReady = true;
    youtubeAPILoading = false;
    initializeYouTubePlayers();
  };

  const script = document.createElement("script");
  script.src = "https://www.youtube.com/iframe_api";
  script.async = true;

  script.onerror = function() {
    youtubeAPILoading = false;
  };

  document.head.appendChild(script);
}

/* INITIALIZE YOUTUBE PLAYER AND RESUME POSITION */

function initializeYouTubePlayers() {
  if (!youtubeAPIReady || !window.YT || !YT.Player) return;

  document.querySelectorAll(".youtube-frame").forEach(frame => {
    if (youtubePlayers.has(frame.id)) return;

    const index = Number(frame.dataset.index);
    const data = streamData[index];

    if (!data || data.platform !== "youtube") return;

    const videoId = getYouTubeID(data.channel);
    if (!videoId) return;

    const saved = youtubeProgress[index];
    const startAt = saved && saved.channel === videoId
      ? Math.max(0, Number(saved.position) || 0)
      : 0;

    const player = new YT.Player(frame.id, {
      events: {
        onReady: function(event) {
          try {
            event.target.mute();

            if (startAt > 0) {
              event.target.seekTo(startAt, true);
            }
          } catch (e) {}
        },

        onStateChange: function(event) {
          if (
            event.data === YT.PlayerState.PLAYING ||
            event.data === YT.PlayerState.PAUSED ||
            event.data === YT.PlayerState.ENDED
          ) {
            savePlayerPosition(index, event.target);
          }
        }
      }
    });

    youtubePlayers.set(frame.id, player);
  });
}

/* SAVE POSITION PERIODICALLY */

setInterval(() => {
  youtubePlayers.forEach((player, frameId) => {
    const frame = document.getElementById(frameId);

    if (frame) {
      savePlayerPosition(Number(frame.dataset.index), player);
    }
  });
}, 1000);

/* SAVE BEFORE REFRESH OR NAVIGATION */

window.addEventListener("pagehide", () => {
  youtubePlayers.forEach((player, frameId) => {
    const frame = document.getElementById(frameId);

    if (frame) {
      savePlayerPosition(Number(frame.dataset.index), player);
    }
  });
});

/* STREAM URL */

function getStreamURL(data, index) {
  const platform = data.platform;
  const channel = data.channel.trim();

  if (!channel) return "about:blank";

  if (platform === "twitch") {
    const parent = window.location.hostname || "localhost";

    return (
      "https://player.twitch.tv/?" +
      "channel=" + encodeURIComponent(channel) +
      "&parent=" + encodeURIComponent(parent) +
      "&autoplay=false&muted=true"
    );
  }

  if (platform === "kick") {
    return (
      "https://player.kick.com/" +
      encodeURIComponent(channel) +
      "?autoplay=false&muted=true"
    );
  }

  if (platform === "youtube") {
    const videoId = getYouTubeID(channel);

    if (!videoId) return "about:blank";

    const saved = youtubeProgress[index];
    const startAt =
      saved && saved.channel === videoId
        ? Math.max(0, Math.floor(Number(saved.position) || 0))
        : 0;

    const params = new URLSearchParams({
      autoplay: "0",
      mute: "1",
      controls: "1",
      rel: "0",
      playsinline: "1",
      enablejsapi: "1"
    });

    if (window.location.protocol === "http:" ||
        window.location.protocol === "https:") {
      params.set("origin", window.location.origin);
    }

    if (startAt > 0) {
      params.set("start", String(startAt));
    }

    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(videoId) +
      "?" + params.toString()
    );
  }

  return "about:blank";
}

/* CHAT */

function buildChat() {
  const chat = document.getElementById("chat");

  if (!chat || !chatEnabled) return;

  const twitchChannels = streamData
    .filter(s => s.platform === "twitch" && s.channel.trim())
    .map(s => s.channel.trim());

  const kickChannels = streamData
    .filter(s => s.platform === "kick" && s.channel.trim())
    .map(s => s.channel.trim());

  let primary = "";
  let merge = "";
  let kickmerge = "";

  if (twitchChannels.length > 0) {
    primary = twitchChannels[0];
    merge = twitchChannels.slice(1).join(",");
    kickmerge = kickChannels.join(",");
  } else if (kickChannels.length > 0) {
    primary = kickChannels[0];
    kickmerge = kickChannels.slice(1).join(",");
  }

  if (!primary) {
    chat.src = "about:blank";
    return;
  }

  const params = new URLSearchParams();

  params.set("channel", primary);
  params.set("size", "1");
  params.set("font", "2");
  params.set("panel", "1");
  params.set("hvbeta", "1");
  params.set("highlight_first", "true");
  params.set("bots", "true");
  params.set("sysmsg", "false");
  params.set("esize", "44");

  if (merge) params.set("merge", merge);
  if (kickmerge) params.set("kickmerge", kickmerge);

  chat.src = "https://hiviseobs.com/chat/v2/?" + params.toString();
}

/* STREAM COUNT */

function setStreamCount(count) {
  count = Number(count);

  while (streamData.length < count) {
    streamData.push(createEmptyStream());
  }

  if (streamData.length > count) {
    streamData.length = count;
  }

  // Remove saved YouTube videos belonging to deleted slots.
  Object.keys(youtubeProgress).forEach(key => {
    if (Number(key) >= count) {
      delete youtubeProgress[key];
    }
  });

  writeStorage(YOUTUBE_STORAGE_KEY, youtubeProgress);
}

/* GRID */

function getGrid(total) {
  let columns;

  if (total <= 2) columns = total;
  else if (total <= 4) columns = 2;
  else if (total <= 9) columns = 3;
  else columns = 4;

  return {
    columns,
    rows: Math.ceil(total / columns)
  };
}

/* STREAM PANEL */

function createStreamPanel(data, index) {
  const panel = document.createElement("div");
  panel.className = "stream-panel";

  const placeholder = document.createElement("div");
  placeholder.className = "stream-placeholder";
  placeholder.textContent = "Insert Stream Name or Video ID";

  if (data.channel.trim()) {
    placeholder.style.display = "none";
  }

  panel.appendChild(placeholder);

  const frame = document.createElement("iframe");
  frame.className = "stream-frame";

  if (data.platform === "youtube" && data.channel.trim()) {
    frame.id = "youtube-player-" + index;
    frame.dataset.index = String(index);
    frame.classList.add("youtube-frame");
  }

  frame.allow =
    "autoplay; fullscreen; encrypted-media; picture-in-picture";
  frame.allowFullscreen = true;
  frame.loading = "eager";
  frame.referrerPolicy = "strict-origin-when-cross-origin";
  frame.src = getStreamURL(data, index);

  panel.appendChild(frame);

  const settings = document.createElement("div");
  settings.className = "stream-settings";

  const platform = document.createElement("select");
  platform.setAttribute("aria-label", "Stream platform");
  platform.innerHTML = `
    <option value="twitch">Twitch</option>
    <option value="kick">Kick</option>
    <option value="youtube">YouTube</option>
  `;
  platform.value = data.platform;

  const input = document.createElement("input");
  input.type = "text";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.value = data.channel;
  input.placeholder = data.platform === "youtube"
    ? "YouTube URL / Video ID"
    : "Stream name";
  input.setAttribute("aria-label", "Stream name or YouTube URL");

  const load = document.createElement("button");
  load.textContent = "LOAD";

  platform.addEventListener("change", () => {
    input.placeholder = platform.value === "youtube"
      ? "YouTube URL / Video ID"
      : "Stream name";
  });

  load.addEventListener("click", () => {
    const newPlatform = platform.value;
    const newChannel = input.value.trim();

    if (
      newPlatform === "youtube" &&
      newChannel &&
      !getYouTubeID(newChannel)
    ) {
      alert("Invalid YouTube URL or video ID.");
      return;
    }

    // Save the old YouTube position before replacing this panel.
    if (data.platform === "youtube") {
      const oldPlayer = youtubePlayers.get(frame.id);
      if (oldPlayer) savePlayerPosition(index, oldPlayer);
    }

    // Remove any old player instance for this slot.
    youtubePlayers.delete(frame.id);

    data.platform = newPlatform;
    data.channel = newChannel;
    data.paused = true;
    data.muted = true;

    // Remember YouTube videos only.
    if (newPlatform === "youtube" && newChannel) {
      const videoId = getYouTubeID(newChannel);
      const oldSaved = youtubeProgress[index];

      if (!oldSaved || oldSaved.channel !== videoId) {
        saveYouTubeProgress(index, videoId, 0);
      }
    } else {
      delete youtubeProgress[index];
      writeStorage(YOUTUBE_STORAGE_KEY, youtubeProgress);
    }

    // Rebuild so the correct player type and controls are created.
    buildLayout();
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") load.click();
  });

  settings.appendChild(platform);
  settings.appendChild(input);
  settings.appendChild(load);
  panel.appendChild(settings);

  return panel;
}

/* BUILD LAYOUT */

function buildLayout() {
  // Save positions before replacing existing iframe elements.
  youtubePlayers.forEach((player, frameId) => {
    const frame = document.getElementById(frameId);

    if (frame) {
      savePlayerPosition(Number(frame.dataset.index), player);
    }
  });

  youtubePlayers.clear();
  layout.innerHTML = "";

  const totalCells = streamData.length + (chatEnabled ? 1 : 0);
  const grid = getGrid(totalCells);

  layout.style.gridTemplateColumns =
    `repeat(${grid.columns}, minmax(0, 1fr))`;

  layout.style.gridTemplateRows =
    `repeat(${grid.rows}, minmax(0, 1fr))`;

  streamData.forEach((data, index) => {
    layout.appendChild(createStreamPanel(data, index));
  });

  if (chatEnabled) {
    const chatPanel = document.createElement("div");
    chatPanel.className = "chat-panel";

    const chat = document.createElement("iframe");
    chat.id = "chat";
    chat.className = "chat-frame";
    chat.title = "Combined Twitch and Kick chat";
    chat.loading = "eager";

    chatPanel.appendChild(chat);
    layout.appendChild(chatPanel);

    buildChat();
  }

  if (streamData.some(
    (data, index) =>
      data.platform === "youtube" &&
      data.channel.trim() &&
      !!document.getElementById("youtube-player-" + index)
  )) {
    loadYouTubeAPI();

    if (youtubeAPIReady) {
      initializeYouTubePlayers();
    }
  }
}

/* SETTINGS MENU */

settingsToggle.addEventListener("click", e => {
  e.stopPropagation();

  if (topbar.style.display === "flex") {
    topbar.style.display = "none";
  } else {
    streamCount.value = streamData.length;
    chatCheckbox.checked = chatEnabled;
    topbar.style.display = "flex";
  }
});

document.addEventListener("click", e => {
  if (!topbar.contains(e.target) && e.target !== settingsToggle) {
    topbar.style.display = "none";
  }
});

topbar.addEventListener("click", e => {
  e.stopPropagation();
});

/* APPLY SETTINGS */

applyBtn.addEventListener("click", () => {
  setStreamCount(Number(streamCount.value));

  chatEnabled = chatCheckbox.checked;

  writeStorage(COUNT_STORAGE_KEY, streamData.length);
  writeStorage(CHAT_STORAGE_KEY, chatEnabled);

  buildLayout();
  topbar.style.display = "none";
});

/* INITIAL LOAD */

streamCount.value = DEFAULT_COUNT;
chatCheckbox.checked = chatEnabled;

buildLayout();
</script>

</body>
</html>
