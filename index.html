```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Stream</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
}

#app {
  display: flex;
  width: 100%;
  height: 100%;
  background: #000;
}

#streams {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: grid;
  gap: 3px;
  background: #000;
}

.stream {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #000;
}

.stream iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #aaa;
  font-size: 18px;
  pointer-events: none;
  text-align: center;
  padding: 20px;
}

.stream-controls {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 5;
  display: flex;
  gap: 5px;
  opacity: 0;
  transition: opacity .2s ease;
}

.stream:hover .stream-controls {
  opacity: 1;
}

.stream-controls button {
  border: 0;
  background: rgba(25,25,25,.9);
  color: white;
  border-radius: 5px;
  padding: 7px 10px;
  cursor: pointer;
}

#settingsToggle {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 1001;
  background: rgba(30,30,30,.95);
  color: white;
  border: 1px solid #555;
  border-radius: 7px;
  width: 38px;
  height: 38px;
  font-size: 20px;
  cursor: pointer;
  opacity: 1;
  visibility: visible;
  transition: opacity .35s ease, visibility .35s ease;
}

#settingsToggle.hidden-ui {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

#topbar {
  position: fixed;
  top: 12px;
  left: 58px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  max-width: calc(100vw - 75px);
  padding: 9px;
  border-radius: 8px;
  background: rgba(18,18,18,.97);
  border: 1px solid #444;
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition: opacity .35s ease, visibility .35s ease, transform .35s ease;
}

#topbar.hidden-ui {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-5px);
}

#topbar input,
#topbar select {
  background: #242424;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  padding: 9px;
  min-width: 130px;
  outline: none;
}

#topbar input {
  width: 220px;
}

#topbar button {
  background: #333;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  padding: 9px 12px;
  cursor: pointer;
}

#topbar button:hover,
.stream-controls button:hover {
  background: #505050;
}

#topbar .hint {
  width: 100%;
  font-size: 11px;
  color: #aaa;
  padding-left: 2px;
}

#chat {
  width: 340px;
  height: 100%;
  border: 0;
  background: #111;
  display: none;
}

#chat.visible {
  display: block;
}

#deathView {
  display: none;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

#deathView.visible {
  display: block;
}

#backButton {
  position: fixed;
  right: 15px;
  top: 15px;
  z-index: 1002;
  display: none;
  border: 0;
  border-radius: 7px;
  padding: 10px 15px;
  background: rgba(30,30,30,.95);
  color: white;
  cursor: pointer;
}

#backButton.visible {
  display: block;
}

@media (max-width: 700px) {
  #topbar {
    left: 54px;
    right: 8px;
    max-width: none;
  }

  #topbar input {
    width: 100%;
    min-width: 0;
  }

  #topbar select {
    min-width: 0;
  }

  #chat {
    width: 40%;
  }
}
</style>
</head>

<body>
<div id="app">
  <div id="streams"></div>
  <iframe id="chat" title="Combined chat"
    src="https://hiviseobs.com/minecraft"></iframe>
  <iframe id="deathView" title="Last death"
    src="https://hiviseobs.com/lastdeath"></iframe>
</div>

<button id="settingsToggle" title="Stream settings">⚙</button>

<div id="topbar">
  <select id="streamCount" aria-label="Number of streams">
    <option value="1">1 Stream</option>
    <option value="2">2 Streams</option>
    <option value="3">3 Streams</option>
    <option value="4">4 Streams</option>
    <option value="5">5 Streams</option>
    <option value="6">6 Streams</option>
    <option value="7">7 Streams</option>
    <option value="8">8 Streams</option>
    <option value="9">9 Streams</option>
    <option value="10">10 Streams</option>
    <option value="11">11 Streams</option>
    <option value="12">12 Streams</option>
  </select>

  <select id="platform" aria-label="Platform">
    <option value="twitch">Twitch</option>
    <option value="kick">Kick</option>
    <option value="youtube">YouTube</option>
  </select>

  <input id="streamName" type="text"
    placeholder="Insert Stream Name or Video ID"
    autocomplete="off">

  <button id="addStream">Add / Update</button>
  <button id="chatToggle">Toggle Chat</button>
  <button id="deathToggle">Last Death ↗</button>
  <button id="closeSettings">Close</button>

  <div class="hint">
    Twitch/Kick streams reset on refresh. YouTube videos and playback positions are saved.
    Streams start paused/muted where supported.
  </div>
</div>

<button id="backButton">← Back to Streams</button>

<script>
const streamsEl = document.getElementById("streams");
const streamCountEl = document.getElementById("streamCount");
const platformEl = document.getElementById("platform");
const streamNameEl = document.getElementById("streamName");
const topbar = document.getElementById("topbar");
const settingsToggle = document.getElementById("settingsToggle");
const chat = document.getElementById("chat");
const deathView = document.getElementById("deathView");
const backButton = document.getElementById("backButton");

let streamData = [];
let youtubePlayers = {};
let idleTimer = null;
let deathPageOpen = false;

const YT_STORAGE_KEY = "multistream_youtube_state_v2";
const COUNT_STORAGE_KEY = "multistream_count_v2";
const CHAT_STORAGE_KEY = "multistream_chat_v2";

function getYouTubeID(input) {
  input = (input || "").trim();
  if (!input) return "";

  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;

  try {
    const url = new URL(input);
    if (url.hostname.includes("youtu.be")) {
      return url.pathname.slice(1).split("/")[0];
    }

    if (url.searchParams.get("v")) {
      return url.searchParams.get("v");
    }

    const parts = url.pathname.split("/").filter(Boolean);
    const embedIndex = parts.findIndex(p =>
      ["embed", "shorts", "live"].includes(p)
    );

    if (embedIndex !== -1) return parts[embedIndex + 1] || "";
  } catch (e) {}

  return input;
}

function loadSavedYouTube() {
  try {
    const saved = JSON.parse(localStorage.getItem(YT_STORAGE_KEY) || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch (e) {
    return [];
  }
}

function saveYouTubeProgress() {
  const saved = [];

  streamData.forEach((stream, index) => {
    if (stream.platform !== "youtube" || !stream.channel) return;

    let position = Number(stream.position || 0);
    const player = youtubePlayers[index];

    try {
      if (player && typeof player.getCurrentTime === "function") {
        position = player.getCurrentTime() || position;
      }
    } catch (e) {}

    saved.push({
      platform: "youtube",
      channel: stream.channel,
      position: Math.max(0, position)
    });
  });

  try {
    localStorage.setItem(YT_STORAGE_KEY, JSON.stringify(saved));
  } catch (e) {}
}

function buildEmbedURL(platform, channel, index) {
  const parent = location.hostname || "localhost";

  if (platform === "twitch") {
    return "https://player.twitch.tv/?channel=" +
      encodeURIComponent(channel) +
      "&parent=" + encodeURIComponent(parent) +
      "&autoplay=false&muted=true";
  }

  if (platform === "kick") {
    return "https://player.kick.com/" +
      encodeURIComponent(channel) +
      "?autoplay=false&muted=true";
  }

  if (platform === "youtube") {
    const videoID = getYouTubeID(channel);
    const start = Math.floor(Number(streamData[index]?.position || 0));

    return "https://www.youtube.com/embed/" +
      encodeURIComponent(videoID) +
      "?enablejsapi=1&autoplay=0&mute=1&controls=1&start=" + start +
      "&playsinline=1&rel=0&origin=" +
      encodeURIComponent(location.origin);
  }

  return "";
}

function makeStream(index) {
  const stream = document.createElement("div");
  stream.className = "stream";
  stream.dataset.index = index;

  const controls = document.createElement("div");
  controls.className = "stream-controls";

  const pauseButton = document.createElement("button");
  pauseButton.textContent = "Pause";
  pauseButton.title = "Pause YouTube video";
  pauseButton.addEventListener("click", () => {
    const player = youtubePlayers[index];
    try {
      if (player && player.pauseVideo) player.pauseVideo();
    } catch (e) {}
  });

  const muteButton = document.createElement("button");
  muteButton.textContent = "Mute";
  muteButton.title = "Mute YouTube video";
  muteButton.addEventListener("click", () => {
    const player = youtubePlayers[index];
    try {
      if (player && player.mute) player.mute();
    } catch (e) {}
  });

  controls.append(pauseButton, muteButton);
  stream.appendChild(controls);

  const data = streamData[index];

  if (!data || !data.channel) {
    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.textContent = "Insert Stream Name or Video ID";
    stream.appendChild(placeholder);
    return stream;
  }

  const iframe = document.createElement("iframe");
  iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  iframe.allowFullscreen = true;
  iframe.title = data.platform + " stream";

  if (data.platform === "youtube") {
    iframe.id = "youtube-player-" + index;
  }

  iframe.src = buildEmbedURL(data.platform, data.channel, index);
  stream.appendChild(iframe);

  return stream;
}

function updateGrid() {
  const count = Number(streamCountEl.value) || 1;
  streamsEl.style.gridTemplateColumns =
    "repeat(" + Math.ceil(Math.sqrt(count)) + ", minmax(0, 1fr))";
  streamsEl.style.gridTemplateRows =
    "repeat(" + Math.ceil(count / Math.ceil(Math.sqrt(count))) + ", minmax(0, 1fr))";
}

function buildLayout() {
  saveYouTubeProgress();
  youtubePlayers = {};

  const count = Number(streamCountEl.value) || 1;

  while (streamData.length < count) {
    streamData.push({ platform: "", channel: "", position: 0 });
  }

  streamData = streamData.slice(0, count);
  streamsEl.innerHTML = "";

  for (let i = 0; i < count; i++) {
    streamsEl.appendChild(makeStream(i));
  }

  updateGrid();
  initYouTubeAPI();
}

function initYouTubeAPI() {
  if (!streamData.some(s => s.platform === "youtube" && s.channel)) return;

  if (window.YT && window.YT.Player) {
    createYouTubePlayers();
    return;
  }

  if (!document.getElementById("youtube-api-script")) {
    const tag = document.createElement("script");
    tag.id = "youtube-api-script";
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  window.onYouTubeIframeAPIReady = createYouTubePlayers;
}

function createYouTubePlayers() {
  streamData.forEach((stream, index) => {
    if (stream.platform !== "youtube" || !stream.channel) return;

    const element = document.getElementById("youtube-player-" + index);
    if (!element) return;

    try {
      youtubePlayers[index] = new YT.Player(element, {
        events: {
          onReady: event => {
            try {
              event.target.mute();
              if (stream.position > 0) {
                event.target.seekTo(stream.position, true);
              }
              event.target.pauseVideo();
            } catch (e) {}
          },
          onStateChange: () => saveYouTubeProgress()
        }
      });
    } catch (e) {}
  });
}

document.getElementById("addStream").addEventListener("click", () => {
  const index = Number(streamCountEl.value) - 1;
  const platform = platformEl.value;
  let channel = streamNameEl.value.trim();

  if (!channel) return;

  if (platform === "youtube") {
    channel = getYouTubeID(channel);
    if (!channel) return;
  }

  saveYouTubeProgress();

  streamData[index] = {
    platform,
    channel,
    position: 0
  };

  streamNameEl.value = "";
  buildLayout();
  showSettingsButton();
});

streamCountEl.addEventListener("change", () => {
  try {
    localStorage.setItem(COUNT_STORAGE_KEY, streamCountEl.value);
  } catch (e) {}
  buildLayout();
  showSettingsButton();
});

document.getElementById("chatToggle").addEventListener("click", () => {
  chat.classList.toggle("visible");
  try {
    localStorage.setItem(CHAT_STORAGE_KEY, chat.classList.contains("visible") ? "1" : "0");
  } catch (e) {}
  showSettingsButton();
});

document.getElementById("deathToggle").addEventListener("click", openDeathPage);

document.getElementById("closeSettings").addEventListener("click", () => {
  hideSettingsButton();
});

settingsToggle.addEventListener("click", () => {
  if (topbar.classList.contains("hidden-ui")) {
    showSettingsButton();
  } else {
    hideSettingsButton();
  }
});

function hideSettingsButton() {
  clearTimeout(idleTimer);
  topbar.classList.add("hidden-ui");
  settingsToggle.classList.add("hidden-ui");
}

function showSettingsButton() {
  clearTimeout(idleTimer);
  topbar.classList.remove("hidden-ui");
  settingsToggle.classList.remove("hidden-ui");

  if (deathPageOpen) return;

  idleTimer = setTimeout(() => {
    // Hide BOTH UI elements at the same time.
    topbar.classList.add("hidden-ui");
    settingsToggle.classList.add("hidden-ui");
  }, 1800);
}

function handleActivity() {
  if (deathPageOpen) return;
  showSettingsButton();
}

["mousemove", "mousedown", "keydown", "wheel", "touchstart"].forEach(eventName => {
  document.addEventListener(eventName, handleActivity, { passive: true });
});

function openDeathPage() {
  saveYouTubeProgress();
  deathPageOpen = true;

  streamsEl.style.display = "none";
  chat.style.display = "none";
  chat.classList.remove("visible");

  deathView.classList.add("visible");
  backButton.classList.add("visible");

  topbar.classList.add("hidden-ui");
  settingsToggle.classList.add("hidden-ui");
  clearTimeout(idleTimer);
}

function closeDeathPage() {
  deathPageOpen = false;

  deathView.classList.remove("visible");
  streamsEl.style.display = "grid";

  if (localStorage.getItem(CHAT_STORAGE_KEY) === "1") {
    chat.classList.add("visible");
    chat.style.display = "block";
  } else {
    chat.classList.remove("visible");
    chat.style.display = "none";
  }

  backButton.classList.remove("visible");
  buildLayout();
  showSettingsButton();
}

backButton.addEventListener("click", closeDeathPage);

try {
  const savedCount = localStorage.getItem(COUNT_STORAGE_KEY);
  if (savedCount) streamCountEl.value = savedCount;

  const savedChat = localStorage.getItem(CHAT_STORAGE_KEY);
  if (savedChat === "1") chat.classList.add("visible");

  streamData = Array.from(
    { length: Number(streamCountEl.value) || 1 },
    () => ({ platform: "", channel: "", position: 0 })
  );

  const savedVideos = loadSavedYouTube();
  savedVideos.forEach((video, index) => {
    if (index < streamData.length && video.channel) {
      streamData[index] = {
        platform: "youtube",
        channel: video.channel,
        position: Number(video.position) || 0
      };
    }
  });
} catch (e) {
  streamData = Array.from({ length: 1 }, () => ({
    platform: "", channel: "", position: 0
  }));
}

buildLayout();
showSettingsButton();

// Save YouTube progress periodically and when leaving/reloading the page.
setInterval(saveYouTubeProgress, 2000);
window.addEventListener("beforeunload", saveYouTubeProgress);
window.addEventListener("pagehide", saveYouTubeProgress);
</script>
</body>
</html>
