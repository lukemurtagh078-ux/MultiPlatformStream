<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Stream</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

#streamPage {
  position: fixed;
  inset: 0;
  background: #000;
}

#layout {
  width: 100%;
  height: 100%;
  display: grid;
  gap: 2px;
  background: #000;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}

.stream-panel,
.chat-panel {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #000;
}

.stream-frame,
.chat-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

.stream-placeholder {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #777;
  font-size: clamp(14px, 2vw, 24px);
  font-weight: bold;
  pointer-events: none;
  background: #000;
}

.stream-settings {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 20;
  display: flex;
  gap: 5px;
  align-items: center;
  padding: 6px;
  border-radius: 7px;
  background: rgba(15,15,15,.94);
  border: 1px solid #444;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
  max-width: calc(100% - 16px);
}

.stream-panel:hover .stream-settings,
.stream-panel:focus-within .stream-settings {
  opacity: 1;
  pointer-events: auto;
}

.stream-settings select,
.stream-settings input,
.stream-settings button {
  height: 32px;
  min-width: 0;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: #fff;
  outline: none;
}

.stream-settings select {
  width: 95px;
  padding: 0 5px;
}

.stream-settings input {
  width: clamp(100px, 15vw, 190px);
  padding: 0 9px;
}

.stream-settings button {
  padding: 0 12px;
  cursor: pointer;
  font-weight: bold;
}

.stream-settings button:hover,
#settingsToggle:hover,
#topbar button:hover {
  background: #9146ff;
}

.chat-frame {
  display: block;
}

#settingsToggle {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 100000;
  width: 40px;
  height: 40px;
  border: 1px solid #444;
  border-radius: 7px;
  background: rgba(20,20,20,.92);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  cursor: pointer;
}

#topbar {
  position: fixed;
  top: 10px;
  left: 60px;
  z-index: 100001;
  display: none;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  max-width: calc(100vw - 75px);
  padding: 9px;
  background: rgba(15,15,15,.97);
  border: 1px solid #444;
  border-radius: 7px;
}

#topbar label {
  color: #fff;
  font-size: 13px;
  font-weight: bold;
}

#topbar select,
#topbar button {
  height: 34px;
  border: 1px solid #555;
  border-radius: 5px;
  background: #171717;
  color: #fff;
}

#topbar select {
  padding: 0 8px;
}

#topbar button {
  padding: 0 13px;
  cursor: pointer;
  font-weight: bold;
}

#chatToggleLabel {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #fff;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  white-space: nowrap;
}

#chatEnabled {
  width: 17px;
  height: 17px;
  accent-color: #9146ff;
  cursor: pointer;
}

@media (max-width: 600px) {
  .stream-settings {
    top: 4px;
    right: 4px;
    gap: 3px;
    padding: 4px;
  }

  .stream-settings select {
    width: 75px;
  }

  .stream-settings input {
    width: 100px;
  }

  .stream-settings button {
    padding: 0 7px;
  }
}
</style>
</head>

<body>

<div id="streamPage">
  <div id="layout"></div>
</div>

<button id="settingsToggle" title="Settings">⚙</button>

<div id="topbar">
  <label for="streamCount">STREAMS:</label>

  <select id="streamCount">
    <option value="1">1 Stream</option>
    <option value="2">2 Streams</option>
    <option value="3" selected>3 Streams</option>
    <option value="4">4 Streams</option>
    <option value="5">5 Streams</option>
    <option value="6">6 Streams</option>
    <option value="7">7 Streams</option>
    <option value="8">8 Streams</option>
    <option value="9">9 Streams</option>
    <option value="10">10 Streams</option>
    <option value="11">11 Streams</option>
    <option value="12">12 Streams</option>
  </select>

  <label id="chatToggleLabel" for="chatEnabled">
    <input type="checkbox" id="chatEnabled" checked>
    CHAT ON
  </label>

  <button id="applyBtn">APPLY</button>
</div>

<script>
/* ALWAYS START FRESH WHEN THE PAGE IS OPENED */

const DEFAULT_STREAM_COUNT = 3;

function createEmptyStream() {
  return {
    platform: "twitch",
    channel: "",
    muted: true,
    paused: true
  };
}

let streamData = Array.from(
  { length: DEFAULT_STREAM_COUNT },
  () => createEmptyStream()
);

let chatEnabled = true;

const layout = document.getElementById("layout");
const settingsToggle = document.getElementById("settingsToggle");
const topbar = document.getElementById("topbar");
const streamCount = document.getElementById("streamCount");
const chatCheckbox = document.getElementById("chatEnabled");
const applyBtn = document.getElementById("applyBtn");

/* STREAM COUNT */

function setStreamCount(count) {
  count = Number(count);

  while (streamData.length < count) {
    streamData.push(createEmptyStream());
  }

  if (streamData.length > count) {
    streamData.length = count;
  }
}

/* YOUTUBE VIDEO ID */

function getYouTubeID(input) {
  input = input.trim();

  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) {
    return input;
  }

  try {
    const url = new URL(input);
    const host = url.hostname.toLowerCase();

    let id = "";

    if (
      host === "youtu.be" ||
      host === "www.youtu.be"
    ) {
      id = url.pathname.split("/").filter(Boolean)[0] || "";
    } else if (
      host === "youtube.com" ||
      host.endsWith(".youtube.com") ||
      host === "youtube-nocookie.com" ||
      host.endsWith(".youtube-nocookie.com")
    ) {
      if (url.searchParams.has("v")) {
        id = url.searchParams.get("v");
      } else {
        const parts = url.pathname.split("/").filter(Boolean);
        const index = parts.findIndex(part =>
          ["embed", "live", "shorts", "v"].includes(part)
        );

        if (index !== -1) {
          id = parts[index + 1] || "";
        }
      }
    }

    return /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;

  } catch (e) {
    return null;
  }
}

/* BUILD STREAM URL */

function getStreamURL(data) {
  const platform = data.platform;
  const channel = data.channel.trim();

  if (!channel) return "about:blank";

  if (platform === "twitch") {
    return (
      "https://player.twitch.tv/?" +
      "channel=" + encodeURIComponent(channel) +
      "&parent=" + encodeURIComponent(
        window.location.hostname || "localhost"
      ) +
      "&autoplay=" + (data.paused ? "false" : "true") +
      "&muted=" + (data.muted ? "true" : "false")
    );
  }

  if (platform === "kick") {
    return (
      "https://player.kick.com/" +
      encodeURIComponent(channel) +
      "?autoplay=" + (data.paused ? "false" : "true") +
      "&muted=" + (data.muted ? "true" : "false")
    );
  }

  if (platform === "youtube") {
    const videoId = getYouTubeID(channel);

    if (!videoId) return "about:blank";

    return (
      "https://www.youtube.com/embed/" +
      encodeURIComponent(videoId) +
      "?autoplay=" + (data.paused ? "0" : "1") +
      "&mute=" + (data.muted ? "1" : "0") +
      "&controls=1" +
      "&rel=0" +
      "&playsinline=1"
    );
  }

  return "about:blank";
}

/* COMBINED CHAT */

function buildChat() {
  const chat = document.getElementById("chat");

  if (!chat || !chatEnabled) return;

  const twitchChannels = streamData
    .filter(s => s.platform === "twitch" && s.channel.trim())
    .map(s => s.channel.trim());

  const kickChannels = streamData
    .filter(s => s.platform === "kick" && s.channel.trim())
    .map(s => s.channel.trim());

  let primary = "";
  let merge = "";
  let kickmerge = "";

  if (twitchChannels.length > 0) {
    primary = twitchChannels[0];
    merge = twitchChannels.slice(1).join(",");
    kickmerge = kickChannels.join(",");
  } else if (kickChannels.length > 0) {
    primary = kickChannels[0];
    kickmerge = kickChannels.slice(1).join(",");
  }

  if (!primary) {
    chat.src = "about:blank";
    return;
  }

  const params = new URLSearchParams();

  params.set("channel", primary);
  params.set("size", "1");
  params.set("font", "2");
  params.set("panel", "1");
  params.set("hvbeta", "1");
  params.set("highlight_first", "true");
  params.set("bots", "true");
  params.set("sysmsg", "false");
  params.set("esize", "44");

  if (merge) params.set("merge", merge);
  if (kickmerge) params.set("kickmerge", kickmerge);

  chat.src =
    "https://hiviseobs.com/chat/v2/?" + params.toString();
}

/* GRID LAYOUT
   The chat counts as one grid cell when enabled.
   When disabled, every cell belongs to a stream.
*/

function getGrid(total) {
  let columns;

  if (total <= 2) {
    columns = total;
  } else if (total <= 4) {
    columns = 2;
  } else if (total <= 6) {
    columns = 3;
  } else if (total <= 9) {
    columns = 3;
  } else {
    columns = 4;
  }

  return {
    columns,
    rows: Math.ceil(total / columns)
  };
}

/* CREATE A STREAM PANEL */

function createStreamPanel(data, index) {
  const panel = document.createElement("div");
  panel.className = "stream-panel";
  panel.dataset.index = index;

  const placeholder = document.createElement("div");
  placeholder.className = "stream-placeholder";
  placeholder.textContent = "Insert Stream name";

  if (data.channel.trim()) {
    placeholder.style.display = "none";
  }

  panel.appendChild(placeholder);

  const frame = document.createElement("iframe");
  frame.className = "stream-frame";
  frame.allow =
    "autoplay; fullscreen; encrypted-media; picture-in-picture";
  frame.allowFullscreen = true;
  frame.loading = "eager";
  frame.referrerPolicy = "strict-origin-when-cross-origin";
  frame.src = getStreamURL(data);

  panel.appendChild(frame);

  const settings = document.createElement("div");
  settings.className = "stream-settings";

  const platform = document.createElement("select");
  platform.setAttribute("aria-label", "Stream platform");
  platform.innerHTML = `
    <option value="twitch">Twitch</option>
    <option value="kick">Kick</option>
    <option value="youtube">YouTube</option>
  `;
  platform.value = data.platform;

  const input = document.createElement("input");
  input.type = "text";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.value = data.channel;
  input.placeholder = data.platform === "youtube"
    ? "YouTube URL / Video ID"
    : "Stream name";
  input.setAttribute("aria-label", "Channel name or video URL");

  const load = document.createElement("button");
  load.textContent = "LOAD";

  platform.addEventListener("change", () => {
    input.placeholder = platform.value === "youtube"
      ? "YouTube URL / Video ID"
      : "Stream name";
  });

  load.addEventListener("click", () => {
    const newChannel = input.value.trim();
    const newPlatform = platform.value;

    if (
      newPlatform === "youtube" &&
      newChannel &&
      !getYouTubeID(newChannel)
    ) {
      alert(
        "That YouTube URL or video ID is not valid. " +
        "Paste a normal YouTube video, Shorts, or live URL."
      );
      return;
    }

    data.platform = newPlatform;
    data.channel = newChannel;

    // Every newly loaded stream starts paused and muted.
    data.paused = true;
    data.muted = true;

    const newFrame = document.createElement("iframe");
    newFrame.className = "stream-frame";
    newFrame.allow =
      "autoplay; fullscreen; encrypted-media; picture-in-picture";
    newFrame.allowFullscreen = true;
    newFrame.loading = "eager";
    newFrame.referrerPolicy = "strict-origin-when-cross-origin";
    newFrame.src = getStreamURL(data);

    frame.replaceWith(newFrame);

    placeholder.style.display =
      data.channel ? "none" : "flex";

    resetAndBuildChat();
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") load.click();
  });

  settings.appendChild(platform);
  settings.appendChild(input);
  settings.appendChild(load);
  panel.appendChild(settings);

  return panel;
}

/* REBUILD CHAT AFTER A STREAM CHANGE */

function resetAndBuildChat() {
  const chat = document.getElementById("chat");

  if (!chat || !chatEnabled) return;

  chat.src = "about:blank";

  setTimeout(() => {
    if (chatEnabled && document.getElementById("chat") === chat) {
      buildChat();
    }
  }, 100);
}

/* BUILD EVERYTHING */

function buildLayout() {
  layout.innerHTML = "";

  const totalCells = streamData.length + (chatEnabled ? 1 : 0);
  const grid = getGrid(totalCells);

  layout.style.gridTemplateColumns =
    `repeat(${grid.columns}, minmax(0, 1fr))`;

  layout.style.gridTemplateRows =
    `repeat(${grid.rows}, minmax(0, 1fr))`;

  streamData.forEach((data, index) => {
    layout.appendChild(createStreamPanel(data, index));
  });

  if (chatEnabled) {
    const chatPanel = document.createElement("div");
    chatPanel.className = "chat-panel";

    const chat = document.createElement("iframe");
    chat.id = "chat";
    chat.className = "chat-frame";
    chat.title = "Combined Twitch and Kick chat";
    chat.loading = "eager";
    chat.referrerPolicy = "strict-origin-when-cross-origin";

    chatPanel.appendChild(chat);
    layout.appendChild(chatPanel);

    buildChat();
  }
}

/* SETTINGS MENU */

settingsToggle.addEventListener("click", e => {
  e.stopPropagation();

  if (topbar.style.display === "flex") {
    topbar.style.display = "none";
  } else {
    streamCount.value = streamData.length;
    chatCheckbox.checked = chatEnabled;
    topbar.style.display = "flex";
  }
});

document.addEventListener("click", e => {
  if (!topbar.contains(e.target) && e.target !== settingsToggle) {
    topbar.style.display = "none";
  }
});

topbar.addEventListener("click", e => {
  e.stopPropagation();
});

/* APPLY STREAM COUNT AND CHAT SETTING */

applyBtn.addEventListener("click", () => {
  setStreamCount(Number(streamCount.value));

  chatEnabled = chatCheckbox.checked;

  buildLayout();

  topbar.style.display = "none";
});

/* INITIAL LOAD: EMPTY STREAMS, CHAT ENABLED */

streamCount.value = DEFAULT_STREAM_COUNT;
chatCheckbox.checked = true;

buildLayout();
</script>

</body>
</html>
